<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luxury Gold Particle Universe</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    body {
        cursor: crosshair;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 210, 100, 0.8);
        font-family: Arial, sans-serif;
        font-size: 14px;
        letter-spacing: 5px;
        background: #000;
        z-index: 10;
        transition: opacity 1s ease;
    }

    #info {
        position: fixed;
        left: 25px;
        bottom: 20px;
        color: rgba(255, 215, 120, 0.45);
        font: 11px Arial, sans-serif;
        letter-spacing: 2px;
        pointer-events: none;
        text-transform: uppercase;
    }
</style>

<!--
    Three.js подключается прямо из CDN.
    Никаких отдельных файлов three.js создавать не надо.
-->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="loading">GOLD UNIVERSE</div>
<div id="info">Move your mouse</div>

<script type="module">

import * as THREE from 'three';

import { EffectComposer }
    from 'three/addons/postprocessing/EffectComposer.js';

import { RenderPass }
    from 'three/addons/postprocessing/RenderPass.js';

import { UnrealBloomPass }
    from 'three/addons/postprocessing/UnrealBloomPass.js';

import { OutputPass }
    from 'three/addons/postprocessing/OutputPass.js';


// ============================================================
// BASIC
// ============================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    200
);

camera.position.z = 30;


// ============================================================
// RENDERER
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

document.body.appendChild(renderer.domElement);


// ============================================================
// POST PROCESSING
// ============================================================

const composer = new EffectComposer(renderer);

const renderPass = new RenderPass(
    scene,
    camera
);

composer.addPass(renderPass);


// GOLD BLOOM

const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
    ),

    2.2,    // strength
    0.8,    // radius
    0.12    // threshold
);

composer.addPass(bloomPass);


// Final color conversion

const outputPass = new OutputPass();

composer.addPass(outputPass);


// ============================================================
// PARTICLES
// ============================================================

const PARTICLES = 45000;

const positions = new Float32Array(PARTICLES * 3);
const colors = new Float32Array(PARTICLES * 3);
const sizes = new Float32Array(PARTICLES);
const randomness = new Float32Array(PARTICLES);

const gold1 = new THREE.Color(0xffd86a);
const gold2 = new THREE.Color(0xffa900);
const gold3 = new THREE.Color(0xfff2b0);


// create spherical cloud

for (let i = 0; i < PARTICLES; i++) {

    const i3 = i * 3;

    const radius =
        2 +
        Math.pow(Math.random(), 0.45) * 22;

    const theta =
        Math.random() * Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    let x =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    let y =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    let z =
        radius *
        Math.cos(phi);


    // distort the cloud
    const distortion =
        Math.sin(theta * 5 + radius * 0.35) *
        0.7;

    x += distortion;
    y += Math.cos(phi * 4) * 0.5;


    positions[i3] = x;
    positions[i3 + 1] = y;
    positions[i3 + 2] = z;


    // GOLD COLOR

    const r = Math.random();

    let c;

    if (r < 0.55) {
        c = gold1;
    }
    else if (r < 0.9) {
        c = gold2;
    }
    else {
        c = gold3;
    }

    colors[i3] = c.r;
    colors[i3 + 1] = c.g;
    colors[i3 + 2] = c.b;


    // particle size

    sizes[i] =
        1.2 +
        Math.pow(Math.random(), 3) * 5;


    randomness[i] =
        Math.random();
}


// ============================================================
// GEOMETRY
// ============================================================

const geometry =
    new THREE.BufferGeometry();

geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);

geometry.setAttribute(
    "color",
    new THREE.BufferAttribute(
        colors,
        3
    )
);

geometry.setAttribute(
    "aSize",
    new THREE.BufferAttribute(
        sizes,
        1
    )
);

geometry.setAttribute(
    "randomness",
    new THREE.BufferAttribute(
        randomness,
        1
    )
);


// ============================================================
// SHADER
// ============================================================

const material =
    new THREE.ShaderMaterial({

    transparent: true,

    depthWrite: false,

    blending: THREE.AdditiveBlending,

    vertexColors: true,

    uniforms: {

        uTime: {
            value: 0
        },

        uPixelRatio: {
            value:
                Math.min(
                    window.devicePixelRatio,
                    2
                )
        }

    },

    vertexShader: `

        uniform float uTime;
        uniform float uPixelRatio;

        attribute float aSize;
        attribute float randomness;

        varying vec3 vColor;

        void main() {

            vec3 p = position;

            // slow organic motion

            float t = uTime * 0.18;

            p.x += sin(
                p.z * 0.25 +
                t +
                randomness * 6.0
            ) * 0.35;

            p.y += cos(
                p.x * 0.22 +
                t * 1.3
            ) * 0.35;

            p.z += sin(
                p.y * 0.2 +
                t * 0.7
            ) * 0.25;


            // subtle rotation

            float angle =
                t * 0.08;

            float cs = cos(angle);
            float sn = sin(angle);

            float px =
                p.x * cs -
                p.z * sn;

            float pz =
                p.x * sn +
                p.z * cs;

            p.x = px;
            p.z = pz;


            vec4 mvPosition =
                modelViewMatrix *
                vec4(p, 1.0);


            float distanceScale =
                38.0 /
                max(
                    1.0,
                    -mvPosition.z
                );


            gl_PointSize =
                aSize *
                uPixelRatio *
                distanceScale;


            gl_Position =
                projectionMatrix *
                mvPosition;


            vColor = color;
        }
    `,

    fragmentShader: `

        varying vec3 vColor;

        void main() {

            vec2 uv =
                gl_PointCoord -
                vec2(0.5);

            float d =
                length(uv);

            if (d > 0.5)
                discard;


            // bright center

            float core =
                1.0 -
                smoothstep(
                    0.0,
                    0.18,
                    d
                );


            // soft glow

            float glow =
                1.0 -
                smoothstep(
                    0.05,
                    0.5,
                    d
                );


            float alpha =
                glow *
                0.8 +
                core *
                0.9;


            vec3 finalColor =
                vColor *
                (
                    1.0 +
                    core * 2.5
                );


            gl_FragColor =
                vec4(
                    finalColor,
                    alpha
                );
        }
    `
});


// ============================================================
// PARTICLE SYSTEM
// ============================================================

const particles =
    new THREE.Points(
        geometry,
        material
    );

scene.add(particles);


// ============================================================
// EXTRA GOLD DUST
// ============================================================

const dustCount = 12000;

const dustPositions =
    new Float32Array(
        dustCount * 3
    );

for (let i = 0; i < dustCount; i++) {

    const i3 = i * 3;

    const r =
        15 +
        Math.random() * 35;

    const a =
        Math.random() *
        Math.PI *
        2;

    const b =
        Math.acos(
            Math.random() * 2 - 1
        );

    dustPositions[i3] =
        r *
        Math.sin(b) *
        Math.cos(a);

    dustPositions[i3 + 1] =
        r *
        Math.sin(b) *
        Math.sin(a);

    dustPositions[i3 + 2] =
        r *
        Math.cos(b);
}


const dustGeometry =
    new THREE.BufferGeometry();

dustGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        dustPositions,
        3
    )
);


const dustMaterial =
    new THREE.PointsMaterial({

        color: 0xffc34a,

        size: 0.06,

        transparent: true,

        opacity: 0.45,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false
    });


const dust =
    new THREE.Points(
        dustGeometry,
        dustMaterial
    );

scene.add(dust);


// ============================================================
// MOUSE
// ============================================================

const mouse =
    new THREE.Vector2(
        999,
        999
    );

const mouseWorld =
    new THREE.Vector3();

const raycaster =
    new THREE.Raycaster();

window.addEventListener(
    "pointermove",
    event => {

        mouse.x =
            event.clientX /
            window.innerWidth *
            2 -
            1;

        mouse.y =
            -(
                event.clientY /
                window.innerHeight
            ) *
            2 +
            1;
    }
);


// ============================================================
// MOUSE FORCE
// ============================================================

function updateMouseForce() {

    raycaster.setFromCamera(
        mouse,
        camera
    );

    const direction =
        raycaster.ray.direction.clone();

    const origin =
        raycaster.ray.origin.clone();


    const distance =
        -origin.z /
        direction.z;


    mouseWorld.copy(
        origin.add(
            direction.multiplyScalar(
                distance
            )
        )
    );
}


// ============================================================
// ANIMATION
// ============================================================

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );

    const elapsed =
        clock.getElapsedTime();


    material.uniforms.uTime.value =
        elapsed;


    updateMouseForce();


    // --------------------------------------------------------
    // MAIN GOLD CLOUD
    // --------------------------------------------------------

    particles.rotation.y =
        elapsed * 0.025;

    particles.rotation.x =
        Math.sin(
            elapsed * 0.15
        ) * 0.08;


    // --------------------------------------------------------
    // MOUSE INTERACTION
    // --------------------------------------------------------

    const dx =
        mouseWorld.x -
        particles.position.x;

    const dy =
        mouseWorld.y -
        particles.position.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const influence =
        Math.max(
            0,
            1 -
            distance / 7
        );


    if (influence > 0) {

        particles.rotation.z +=
            influence * 0.008;

        particles.scale.x =
            1 +
            influence * 0.05;

        particles.scale.y =
            1 +
            influence * 0.05;
    }
    else {

        particles.scale.x +=
            (1 -
                particles.scale.x)
            * 0.03;

        particles.scale.y +=
            (1 -
                particles.scale.y)
            * 0.03;
    }


    // --------------------------------------------------------
    // BACKGROUND DUST
    // --------------------------------------------------------

    dust.rotation.y =
        elapsed * 0.012;

    dust.rotation.x =
        Math.sin(
            elapsed * 0.08
        ) * 0.1;


    // --------------------------------------------------------
    // CAMERA FLOAT
    // --------------------------------------------------------

    camera.position.x +=
        (
            mouse.x * 1.2 -
            camera.position.x
        ) * 0.015;

    camera.position.y +=
        (
            mouse.y * 0.8 -
            camera.position.y
        ) * 0.015;


    camera.lookAt(
        0,
        0,
        0
    );


    // --------------------------------------------------------
    // RENDER
    // --------------------------------------------------------

    composer.render();
}


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        composer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        material.uniforms
            .uPixelRatio.value =
                Math.min(
                    window.devicePixelRatio,
                    2
                );
    }
);


// ============================================================
// START
// ============================================================

window.addEventListener(
    "load",
    () => {

        const loading =
            document.getElementById(
                "loading"
            );

        loading.style.opacity = "0";

        setTimeout(
            () => {
                loading.remove();
            },
            1000
        );
    }
);


animate();

</script>

</body>
</html>
